global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

# The scoring API and the drift monitor run on the host (not in Compose); Docker Desktop resolves
# host.docker.internal to the host.
scrape_configs:
  - job_name: scoring-api
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: drift-monitor
    static_configs:
      - targets: ["host.docker.internal:8001"]
