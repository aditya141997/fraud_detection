name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Synthetic data and fakes only: no Redis, Kafka or MLflow server. tests/test_feature_parity.py needs the
      # IEEE-CIS parquet files (not in the repo) and skips itself here; run it locally after `make data features`.
      - name: Test
        run: python -m pytest -q
