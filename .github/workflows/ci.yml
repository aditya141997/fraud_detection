name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Synthetic data and fakes only: no Redis, Kafka or MLflow server. tests/test_feature_parity.py needs the
      # IEEE-CIS parquet files (not in the repo) and skips itself here; run it locally after `make data features`.
      - name: Test
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the serving image
        run: docker build -t fraud-api .
      - name: Start it against Redis and check /health
        run: |
          docker network create ci
          docker run -d --name redis --network ci redis:7-alpine
          docker run -d --name api --network ci -p 8000:8000 \
            -e REDIS_URL=redis://redis:6379 -e PUBLISH_SCORED_EVENTS=0 -e WORKERS=1 fraud-api
          for i in $(seq 1 60); do
            curl -sf localhost:8000/health && exit 0
            sleep 5
          done
          docker logs api
          exit 1
